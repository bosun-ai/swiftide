<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Swiftide composition overview</title>
  <desc id="desc">Swiftide core primitives connect your Rust code to the agent harness, task graphs, RAG pipelines, and integrations.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #1f2937; stroke-width: 2.5; }
      .core { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; }
      .code { fill: #ecfeff; stroke: #0e7490; stroke-width: 2.5; }
      .label { fill: #111827; font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #374151; font: 650 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .line { fill: none; stroke: #475569; stroke-width: 2.5; stroke-linecap: round; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
      .soft { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .warm { fill: #ffedd5; stroke: #c2410c; stroke-width: 2; }
      .green { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .violet { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2; }
      .shadow { filter: drop-shadow(0 12px 24px rgb(15 23 42 / 0.10)); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520" rx="22" />

  <path class="flow" d="M450 210 C388 178 346 130 300 130" />
  <path class="flow" d="M450 310 C388 342 346 390 300 390" />
  <path class="flow" d="M750 210 C812 178 854 130 900 130" />
  <path class="flow" d="M750 310 C812 342 854 390 900 390" />


  <rect class="core shadow" x="450" y="176" width="300" height="168" rx="24" />
  <text class="label" x="600" y="326" text-anchor="middle">Core Primitives</text>

  <rect class="card shadow" x="60" y="70" width="285" height="120" rx="18" />
  <circle class="soft" cx="105" cy="130" r="26" />
  <path class="line" d="M94 130 C94 117 109 110 119 119" />
  <path class="line" d="M120 119 L120 109 L130 109" />
  <path class="line" d="M117 130 C117 143 102 150 92 141" />
  <path class="line" d="M91 141 L91 151 L81 151" />
  <text class="label" x="148" y="140">Agent Harness</text>

  <rect class="card shadow" x="60" y="330" width="285" height="120" rx="18" />
  <circle class="violet" cx="105" cy="390" r="26" />
  <circle class="card" cx="92" cy="384" r="6" />
  <circle class="card" cx="118" cy="384" r="6" />
  <circle class="card" cx="105" cy="405" r="6" />
  <path class="line" d="M98 386 L112 386" />
  <path class="line" d="M96 389 L102 399" />
  <path class="line" d="M115 389 L108 399" />
  <text class="label" x="148" y="400">Task Graphs</text>

  <rect class="card shadow" x="855" y="70" width="285" height="120" rx="18" />
  <circle class="green" cx="900" cy="130" r="26" />
  <rect class="card" x="887" y="112" width="24" height="32" rx="4" />
  <path class="line" d="M893 121 H905" />
  <path class="line" d="M893 130 H905" />
  <path class="line" d="M893 139 H901" />
  <circle class="bg" cx="916" cy="143" r="8" />
  <path class="line" d="M922 149 L930 157" />
  <text class="label" x="948" y="140">RAG Pipelines</text>

  <rect class="card shadow" x="855" y="330" width="285" height="120" rx="18" />
  <circle class="warm" cx="900" cy="390" r="26" />
  <path class="line" d="M891 377 V390" />
  <path class="line" d="M909 377 V390" />
  <path class="line" d="M884 390 H916" />
  <path class="line" d="M892 390 C892 404 908 404 908 390" />
  <path class="line" d="M900 404 V414" />
  <text class="label" x="948" y="400">Integrations</text>
</svg>
