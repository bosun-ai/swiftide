[package]
name = "swiftide-temporary-regression-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
live-openai = ["dep:swiftide", "swiftide/openai"]
live-anthropic = ["dep:swiftide", "swiftide/anthropic"]
live-bedrock = [
  "dep:swiftide",
  "swiftide/aws-bedrock",
]

[dependencies]
anyhow = "1.0"
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
swiftide-core = { path = "../swiftide-core" }
tokio = { version = "1.46", features = ["macros", "rt-multi-thread"] }

swiftide = { path = "../swiftide", default-features = false, optional = true }
