[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unlicense",
  "CC0-1.0",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
]

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "Instant is unmaintained" },
  { id = "RUSTSEC-2024-0436", reason = "Paste is transitive and has no safe upgrade" },
  { id = "RUSTSEC-2025-0012", reason = "Backoff is transitive through async-anthropic and has no safe upgrade" },
  { id = "RUSTSEC-2025-0134", reason = "Rustls-pemfile is transitive through qdrant-client and has no safe upgrade" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
