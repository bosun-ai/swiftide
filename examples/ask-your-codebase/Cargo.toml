[package]
name = "ask-your-codebase"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Swiftide showcase: index a codebase locally and ask questions about it"
readme = "README.md"
keywords = ["rag", "swiftide", "tree-sitter", "lancedb", "fastembed"]
categories = ["command-line-utilities"]

[dependencies]
swiftide = { path = "../../swiftide", default-features = false, features = [
  "tree-sitter",
  "fastembed",
  "lancedb",
  "redb",
  "openai",
] }
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
async-trait = "0.1"
# Same major version as swiftide uses, to pick a FastEmbed model
fastembed = { version = "5", default-features = false }
clap = { version = "4.6", features = ["derive", "env"] }
# Same version as swiftide uses, to find unit tests in Rust files
tree-sitter = { version = "0.26", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
# Same version as swiftide uses, to render a document as the query pipeline does
serde_json = "1"

[lints]
workspace = true
