[package]
name = "swiftide-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
description.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
swiftide-core = { path = "../swiftide-core", version = "0.32" }
swiftide-tasks = { path = "../swiftide-tasks", version = "0.32" }
swiftide-indexing = { path = "../swiftide-indexing", version = "0.32" }
anyhow.workspace = true
async-trait.workspace = true
dyn-clone.workspace = true
derive_builder.workspace = true
indoc.workspace = true
tracing.workspace = true
tokio.workspace = true
# pretty_assertions.workspace = true
strum.workspace = true
strum_macros.workspace = true
serde.workspace = true
serde_json.workspace = true
fs-err = { workspace = true, features = ["tokio"] }
thiserror.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["io", "rt"] }
convert_case.workspace = true
schemars = { workspace = true, features = ["derive"] }
process-wrap = { version = "=9.0.3", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }

# Mcp
rmcp = { workspace = true, optional = true, default-features = false, features = [
  "base64",
  "client",
  "macros",
  "server",
] }

[dev-dependencies]
swiftide-core = { path = "../swiftide-core", features = ["test-utils"] }
test-log.workspace = true
temp-dir.workspace = true
insta.workspace = true
rmcp = { workspace = true, features = ["server"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
mcp = ["dep:rmcp"]
json-schema = ["swiftide-core/json-schema"]
langfuse = []
